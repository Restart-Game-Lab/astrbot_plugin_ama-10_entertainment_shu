name: AstrBot Deploy (Update + Reload)

# 任意 push 到 main 分支（含直接提交与合并 PR）后，自动通知 AstrBot
# 拉取最新代码并重载插件，实现"提交即生效"。
on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发
    inputs:
      dry_run:
        description: "Dry run（只打印将调用的端点，不实际更新）"
        type: boolean
        default: false

concurrency:
  group: astrbot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_API_KEY: ${{ secrets.ASTRBOT_API_KEY }}
        run: |
          miss=""
          [ -z "$ASTRBOT_URL" ] && miss="$miss ASTRBOT_URL"
          [ -z "$ASTRBOT_API_KEY" ] && miss="$miss ASTRBOT_API_KEY"
          if [ -n "$miss" ]; then
            echo "::error::Missing required secrets:$miss"
            echo "请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置："
            echo "  ASTRBOT_URL        AstrBot WebUI 地址，例如 http://192.168.1.10:6185"
            echo "  ASTRBOT_API_KEY    在 AstrBot WebUI 设置中创建的 API Key（abk_xxx），需含 plugin 权限"
            exit 1
          fi

      - name: Determine plugin id and repo from metadata
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          plugin_id=$(grep '^name:' metadata.yaml | awk '{print $2}')
          echo "plugin_id=${plugin_id}"
          echo "repo=${REPO}"
          echo "plugin_id=${plugin_id}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Update and reload plugin on AstrBot
        id: deploy
        env:
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_API_KEY: ${{ secrets.ASTRBOT_API_KEY }}
          PLUGIN_ID: ${{ steps.meta.outputs.plugin_id }}
          REPO: ${{ steps.meta.outputs.repo }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          url=${ASTRBOT_URL%/}
          base="${url}/api/plugins"

          echo "==== AstrBot 自动部署 ===="
          echo "base_url : ${url}"
          echo "plugin_id: ${PLUGIN_ID}"
          echo "repo     : ${REPO}"
          echo "dry_run  : ${DRY_RUN}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::warning::DRY RUN 模式，仅打印将执行的请求"
            echo "  POST ${base}/${PLUGIN_ID}/update"
            echo "  POST ${base}/reload   body: { plugin_id: ${PLUGIN_ID} }"
            exit 0
          fi

          # helper: 请求 AstrBot，打印响应并判断是否成功
          # 成功 = HTTP 2xx 且返回 JSON 无 "status":"error"
          astrbot_call() {
            local label=$1; shift
            local resp
            echo ""
            echo ">>> ${label}"
            resp=$(curl -fsS "$@") || { echo "::error::${label} HTTP 请求失败"; return 1; }
            echo "${resp}"
            if echo "${resp}" | grep -q '"status"[[:space:]]*:[[:space:]]*"error"'; then
              echo "::error::${label} 返回业务错误"
              return 1
            fi
            return 0
          }

          astrbot_call "1/2 更新插件代码（服务端 git pull）" \
            -X POST "${base}/${PLUGIN_ID}/update" \
            -H "X-API-Key: ${ASTRBOT_API_KEY}" \
            -H "Content-Type: application/json" \
            || exit 1

          astrbot_call "2/2 重载插件（让新代码生效）" \
            -X POST "${base}/reload" \
            -H "X-API-Key: ${ASTRBOT_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"plugin_id\":\"${PLUGIN_ID}\"}" \
            || exit 1

          echo ""
          echo "==== 部署成功 ===="

      - name: Retry update/reload (best-effort) on transient failure
        if: steps.deploy.outcome == 'failure'
        env:
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_API_KEY: ${{ secrets.ASTRBOT_API_KEY }}
          PLUGIN_ID: ${{ steps.meta.outputs.plugin_id }}
        run: |
          echo "::warning::首次调用失败，重试一次（间隔 15s）"
          sleep 15
          curl -fsS -X POST "${ASTRBOT_URL%/}/api/plugins/${PLUGIN_ID}/update" \
            -H "X-API-Key: ${ASTRBOT_API_KEY}" \
            -H "Content-Type: application/json" \
            && echo "" \
            && curl -fsS -X POST "${ASTRBOT_URL%/}/api/plugins/reload" \
            -H "X-API-Key: ${ASTRBOT_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"plugin_id\":\"${PLUGIN_ID}\"}" || true
